<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS — Autenticação de Acesso Empresarial</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #090d16;
            --bg-card: #111827;
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --accent-cyan: #06b6d4;
            --accent-rose: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Efeito Glow Orbs de Fundo */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
        }
        .orb-1 {
            width: 380px;
            height: 380px;
            background: var(--primary-glow);
            top: -10%;
            left: -10%;
        }
        .orb-2 {
            width: 320px;
            height: 320px;
            background: rgba(6, 182, 212, 0.2);
            bottom: -10%;
            right: -10%;
        }

        /* Container do Form de Login */
        .login-card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            position: relative;
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary), var(--accent-cyan));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin: 0 auto 1rem auto;
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 1.2rem;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .form-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            background: rgba(15, 23, 42, 0.9);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent-cyan));
            color: #fff;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 1.75rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        .error-message {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: var(--accent-rose);
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-icon">
                <i class="fa-solid fa-drumstick-bite"></i>
            </div>
            <div class="brand-title">SaaS Enterprise</div>
            <div class="brand-subtitle">Plataforma de Gestão de Açougues & Varejo</div>
        </div>

        <div id="alert-erro" class="error-message">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="txt-erro">Usuário ou senha incorretos!</span>
        </div>

        <form id="form-login" onsubmit="validarLogin(event)">
            <div class="form-group">
                <label class="form-label">Usuário</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="usuario" class="form-input" placeholder="Digite seu usuário" required autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Senha de Acesso</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="senha" class="form-input" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <span>Entrar no Sistema</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>

    <script>
        async function validarLogin(e) {
            if (e) e.preventDefault();
            const usr = document.getElementById('usuario').value.trim();
            const pass = document.getElementById('senha').value.trim();
            const erroDiv = document.getElementById('alert-erro');
            const txtErro = document.getElementById('txt-erro');

            try {
                const res = await fetch('http://localhost:5205/api/ModulosSaaS/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: usr, senha: pass })
                });

                const data = await res.json();

                if (res.ok && data.status === 'Sucesso') {
                    localStorage.setItem('saas_usuario_logado', data.usuario.nome);
                    localStorage.setItem('saas_jwt_token', data.token);
                    localStorage.setItem('saas_tenant_id', data.usuario.tenantId);
                    window.location.href = 'index.html';
                } else {
                    erroDiv.style.display = 'flex';
                    txtErro.innerText = data.mensagem || 'Usuário ou senha incorretos!';
                }
            } catch (err) {
                // Fallback para devgege offline
                if (usr === 'devgege' && pass === 'Dev31082002') {
                    localStorage.setItem('saas_usuario_logado', 'Geovane Paredes');
                    window.location.href = 'index.html';
                } else {
                    erroDiv.style.display = 'flex';
                    txtErro.innerText = 'Falha ao conectar com o servidor de autenticação!';
                }
            }
        }
    </script>
</body>
</html>
